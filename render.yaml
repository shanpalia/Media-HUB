services:
  - type: web
    name: media-hub-resolver
    runtime: python
    plan: free
    region: singapore
    buildCommand: apt-get update && apt-get install -y ffmpeg curl git && curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs && git clone --single-branch --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /opt/bgutil-ytdlp-pot-provider && cd /opt/bgutil-ytdlp-pot-provider/server && npm ci && npx tsc && cd - && pip install -r backend/requirements.txt
    startCommand: uvicorn resolver:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
