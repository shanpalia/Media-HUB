services:
  - type: web
    name: media-hub-resolver
    runtime: python
    plan: free
    region: singapore
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r backend/requirements.txt
    startCommand: uvicorn resolver:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
